name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Node 22, а не 20: `jsdom@30` требует `^22.22.2 || ^24.15.0 || >=26`, и его
      # `undici@8` зовёт `webidl.util.markAsUncloneable`, которого в двадцатке нет.
      # На Node 20 КАЖДЫЙ файл с `// @vitest-environment jsdom` падал на импорте —
      # то есть все экранные тесты в CI не выполнялись вовсе, а зелёный локальный
      # гейт это прятал: на этой машине Node 22.
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck workspaces
        run: npm run typecheck

      # Линтер ловит то, чего не видит tsc: осиротевшие импорты и переменные,
      # которые остаются после рефакторинга и притворяются живым кодом. На первом
      # же прогоне (2026-08-11) он нашёл 16 таких мест — включая обёртку в app.ts,
      # над которой стоял комментарий «keep the short local names so the many call
      # sites below don't change», хотя вызовов не осталось ни одного.
      - name: Lint
        run: npm run lint

      - name: Build Mini App
        run: npm run build --workspace @planer/miniapp

      - name: Build admin UI
        run: npm run build --workspace @planer/admin

  # Отдельным заданием, чтобы красный е2е не прятал результат гейта и наоборот. Браузер
  # живёт в своём пакете e2e/: в корневом lockfile он уехал бы в `npm ci` папки прода.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install e2e dependencies
        run: npm ci --prefix e2e

      - name: Install Chromium
        run: npx --prefix e2e playwright-core install --with-deps chromium

      - name: Run e2e
        run: npm run e2e

      - name: Upload screenshots and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: e2e/.out
