<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Смены</title>
    <style>
      .boot-screen {
        font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 20px 24px;
        max-width: 520px;
        margin: 0 auto;
      }
      #root:not(:empty) ~ .boot-screen { display: none; }
    </style>
    <!--
      Спасательный круг загрузки. Живёт прямо здесь и только на ES5 — это не
      небрежность, а условие работы.

      Когда бандл собран под систему новее той, что стоит у человека, браузер не
      выполняет из него НИ ОДНОЙ строки: модуль не парсится целиком. Значит ни
      React, ни ErrorBoundary, ни импортированный обработчик ошибок до дела не
      доходят — экран остаётся белым и молчит. Единственный код, который в этот
      момент уже выполнился, — вот этот, встроенный в разметку и написанный
      синтаксисом, который понимает даже очень старый движок. Одна стрелочная
      функция здесь — и спасательный круг тонет вместе с приложением; сторож
      `miniapp/src/boot-fallback.test.ts` это проверяет.

      Полифил Object.hasOwn нужен по той же причине: его зовёт valibot внутри
      @telegram-apps/sdk при старте, а появился он только в Safari 15.4 —
      понизить вызов сборкой нельзя, лечится только подменой.
    -->
    <script>
      if (!Object.hasOwn) {
        Object.hasOwn = function (target, key) {
          return Object.prototype.hasOwnProperty.call(target, key);
        };
      }

      (function () {
        var WAIT_MS = 25000;
        var reason = "";

        function remember(text) {
          if (!reason && text) reason = String(text).slice(0, 400);
        }

        window.addEventListener("error", function (event) {
          var target = event && event.target;
          if (target && (target.tagName === "SCRIPT" || target.rel === "modulepreload")) {
            remember("Не загрузился файл приложения");
            if (document.body) rescue();
            else document.addEventListener("DOMContentLoaded", rescue);
          } else {
            remember(event && event.message ? event.message : "Ошибка приложения");
          }
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          remember(event && event.reason ? event.reason : "unhandled rejection");
        });

        function started() {
          var root = document.getElementById("root");
          return !!root && root.children.length > 0;
        }

        /* Отчёт уходит на сервер — иначе про поломку у конкретного человека
           никто не узнает: он видит белый экран и просто закрывает приложение. */
        function report() {
          try {
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "/api/client-error", true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.send(
              JSON.stringify({
                reason: reason || "Начальный экран не появился за 25 секунд",
                userAgent: navigator.userAgent,
                // В параметрах запуска Telegram бывают подписанные данные входа.
                url: (location.origin + location.pathname).slice(0, 200)
              })
            );
          } catch (ignored) {}
        }

        function rescue() {
          if (started() || document.getElementById("boot-fallback")) return;
          report();

          var box = document.createElement("div");
          box.id = "boot-fallback";
          box.className = "boot-screen";
          box.setAttribute("role", "alert");
          box.innerHTML =
            '<h1 style="font-size:19px;margin:0 0 12px">Приложение не открылось</h1>' +
            '<p>Проверь связь и попробуй ещё раз. График также доступен кнопкой «📅 График» в чате с ботом.</p>' +
            '<button type="button" style="font:inherit;min-height:44px;padding:0 14px">Повторить</button>';
          box.querySelector("button").onclick = function () { location.reload(); };
          var pending = document.getElementById("boot-pending");
          if (pending) pending.hidden = true;
          document.body.appendChild(box);
        }

        window.setTimeout(rescue, WAIT_MS);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-pending" class="boot-screen" role="status">Открываем смены…</div>
    <script>
      /* Статус уже в DOM. Если ждать полной загрузки страницы, Telegram
         держит свою заглушку до окончания скачивания всех модулей. */
      (function () {
        var eventType = "web_app_ready";
        try {
          if (window.TelegramWebviewProxy && typeof window.TelegramWebviewProxy.postEvent === "function") {
            window.TelegramWebviewProxy.postEvent(eventType, "");
          } else if (window.parent !== window) {
            window.parent.postMessage(JSON.stringify({ eventType: eventType }), "*");
          } else if (window.external && typeof window.external.notify === "function") {
            window.external.notify(JSON.stringify({ eventType: eventType }));
          }
        } catch (ignored) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
